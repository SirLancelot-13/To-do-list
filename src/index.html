<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>
    <nav style="background-color:#06005c;color:white;padding-left:2rem;padding-top:1rem;padding-bottom:1rem;">
        <h1 style="font-weight:900">The To-Do List</h1>
    </nav>
    <div id="main_page" style="padding: 1rem;">
        <div id="task_list">
            <button id="add-tasks-button" style="margin-top:1rem;padding:0.5rem 1rem;font-size:1rem;background-color:#06005c;color:white; border: none; cursor: pointer;">Add a New Task</button>
            
            <dialog id="Add-new-task">
                <form style="display:flex;flex-direction:column;gap:1rem;padding:1rem;">
                    <h2 style="margin:0;">New Task</h2>
                    <label>
                        Task:
                        <input type="text" id="task-name" required style="width:100%;padding:0.5rem;font-size:1rem;margin-top:0.5rem;"/>
                    </label>
                    <label>
                        Due Date:
                        <input type="date" id="due-date" required style="width:100%;padding:0.5rem;font-size:1rem;margin-top:0.5rem;"/>
                    </label>
                    <label>
                        Task Description:
                        <textarea id="task-desc" rows="4" style="width:100%;padding:0.5rem;font-size:1rem;margin-top:0.5rem;overflow:scroll"></textarea>
                    </label>
                    <label>
                        Priority:
                        <select id="task-priority" style="width:100%;padding:0.5rem;font-size:1rem;margin-top:0.5rem;">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </label>
                    <div style="display:flex;justify-content:flex-end;gap:1rem;">
                                                <button type="button" value="cancel" style="padding:0.5rem 1rem;font-size:1rem;background-color:#ccc;border:none;cursor:pointer;">Cancel</button>
                        <button type="submit" id="confirm-task-button" value="default" style="padding:0.5rem 1rem;font-size:1rem;background-color:#06005c;color:white;border:none;cursor:pointer;">Add Task</button>
                    </div>
                </form>
            </dialog>
            <div id="DisplayTasks">
                </div>
        </div>
    </div>
    <script src="C:\Users\Pranjal\OneDrive\Desktop\Project-To-Do-List\src\main.js"></script>
</body>
</html>
